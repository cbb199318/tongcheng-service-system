server:
  port: 8080

spring:
  application:
    name: tongcheng-service-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/tongcheng;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: tongcheng-service-system-demo-secret-key-2026
  expire-hours: 24

app:
  upload-dir: backend/uploads
